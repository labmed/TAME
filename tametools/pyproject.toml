[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tametools"
version = "0.4.0"
description = "Metadata-preserving clinical data workflows and analysis with TAME"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "openpyxl",
  "tomli",
]

[project.optional-dependencies]
analysis = [
  "statsmodels>=0.14,<0.16",
  "scikit-learn==1.7.2",
  "samplics==0.4.55",
  "scipy>=1.13",
  "matplotlib",
  "python-docx",
]
nhanes = [
  "pyreadstat==1.3.2",
]
integration = [
  "pint==0.24.4",
]
survey = [
  "samplics==0.4.55",
  "scipy>=1.13",
]
parquet = [
  "pyarrow",
]
stats = [
  "scipy",
  "scikit-learn==1.7.2",
]
report = [
  "matplotlib",
  "python-docx",
]
web = [
  "fastapi",
  "uvicorn",
  "python-multipart",
]
windows = [
  # PyInstaller 6.0+ required: the .spec files pass Analysis(optimize=...), a
  # 6.x-only kwarg, and 6.x dropped the pkg_resources import that breaks under
  # setuptools>=81.
  "pyinstaller>=6",
]

[project.scripts]
tametools = "tametools.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# 기본 플러그인은 tametools.plugins 패키지에 들어 있으며, plugin_base.manager 가 파일 경로로 로드한다.
